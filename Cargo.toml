[package]
name = "cc_loc_tool"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "cc_loc_tool"
path = "src/main.rs"

[[bin]]
name = "cc_loc_cli"
path = "src/cli_main.rs"

[dependencies]
anyhow = "1.0.100"
chrono = "0.4.38"
csv = "1.3.0"
dirs = "5.0.1"
encoding_rs = "0.8.35"
gpui-kit = "0.6"
html-escape = "0.2.13"
rayon = "1.10.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.116"
toml = "0.8.11"
walkdir = "2.5.0"

# gpui-component 0.6.4 的 inspector 模块仍按 gpui-pre 0.3.5 的
# register_inspector_element 签名编写，与 0.3.6 不兼容。该模块仅在
# debug_assertions 下参与编译，故对这一个包关闭 debug assertions 规避；
# release 构建本就不编译该模块，行为不变。
[profile.dev.package.gpui-component]
debug-assertions = false
